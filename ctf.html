<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박대만 | CTF Write-up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --primary-color: #39d353;
            --card-color: #161b22;
            --border-color: #30363d;
            --header-height: 60px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        h1, h2, h3 {
            font-family: 'Roboto Mono', monospace;
            color: var(--primary-color);
            text-shadow: 0 0 5px rgba(57, 211, 83, 0.4);
        }

        /* 헤더 & 네비게이션 */
        .main-header {
            position: sticky;
            top: 0;
            width: 100%;
            height: var(--header-height);
            background-color: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .main-header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo {
            font-size: 1.5rem;
            color: #fff;
            text-decoration: none;
            text-shadow: 0 0 5px var(--primary-color);
        }
        
        .main-nav ul {
            display: flex;
            list-style: none;
            gap: 10px;
            align-items: center;
        }

        .main-nav a {
            color: var(--text-color);
            text-decoration: none;
            padding: 8px 12px;
            font-weight: 700;
            border-radius: 4px;
            transition: color 0.3s, background 0.3s;
        }

        .main-nav a:hover, .main-nav a.active {
            color: var(--primary-color);
            background: rgba(57, 211, 83, 0.1);
            text-shadow: 0 0 8px var(--primary-color);
        }

        .btn-write {
            background: rgba(57, 211, 83, 0.15) !important;
            border: 1px solid var(--primary-color);
            color: var(--primary-color) !important;
            cursor: pointer;
        }
        .btn-write:hover {
            background: var(--primary-color) !important;
            color: #000 !important;
        }

        /* 본문 섹션 */
        .content-section {
            padding: 60px 0;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 15px;
        }

        .section-desc {
            text-align: center;
            color: #8b949e;
            margin-bottom: 40px;
        }

        /* 노트북/윈도우 맞춤형 대형 모달 창 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-color);
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            width: 90%;
            max-width: 850px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .modal-close {
            background: none;
            border: none;
            color: #8b949e;
            font-size: 1.8rem;
            cursor: pointer;
        }
        .modal-close:hover { color: #fff; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: var(--primary-color);
            font-weight: bold;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #c9d1d9;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.95rem;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 5px rgba(57, 211, 83, 0.3);
        }

        .form-group textarea {
            resize: vertical;
            height: 220px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 25px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .btn-submit {
            background: var(--primary-color);
            color: #000;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Roboto Mono', monospace;
            font-size: 1rem;
        }
        .btn-submit:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px var(--primary-color);
        }

        /* 터미널 및 리스트 스타일 */
        .terminal-bar {
            background: #010409;
            border: 1px solid var(--border-color);
            border-radius: 6px 6px 0 0;
            padding: 10px 15px;
            font-size: 0.9rem;
            color: #8b949e;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .writeup-list {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-top: none;
            border-radius: 0 0 6px 6px;
            margin-bottom: 50px;
        }

        .writeup-item {
            padding: 20px 25px;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
            cursor: pointer;
        }

        .writeup-item:last-child {
            border-bottom: none;
        }

        .writeup-item:hover {
            background: rgba(57, 211, 83, 0.03);
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        .meta-left {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .tag {
            background: #21262d;
            color: var(--primary-color);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .date {
            color: #8b949e;
        }

        .writeup-title-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .writeup-title {
            font-size: 1.2rem;
            color: #fff;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: #8b949e;
            padding: 4px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
        }
        .action-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        .action-btn.del:hover {
            border-color: #ff5f56;
            color: #ff5f56;
        }

        .link-btn {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        .link-btn:hover {
            background: var(--primary-color);
            color: #000;
        }

        .writeup-summary {
            font-size: 0.95rem;
            color: #8b949e;
        }

        .writeup-detail {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #0d1117;
            border-left: 3px solid var(--primary-color);
            font-size: 0.9rem;
            color: #c9d1d9;
            white-space: pre-wrap;
        }

        .writeup-item.active .writeup-detail {
            display: block;
        }

        .main-footer {
            text-align: center;
            padding: 20px;
            background: #010409;
            border-top: 1px solid var(--border-color);
            color: #8b949e;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo">박대만</a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html#about">소개</a></li>
                    <li><a href="index.html#skills">기술</a></li>
                    <li><a href="index.html#projects">프로젝트</a></li>
                    <li><a href="ctf.html" class="active">CTF Write-up</a></li>
                    <li><a href="index.html#contact">연락처</a></li>
                    <li><a href="#" class="btn-write" id="openModalBtn">+ 라이트업 작성</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- 대형 작성/수정 모달 창 -->
    <div class="modal-overlay" id="writeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalHeading">새로운 CTF Write-up 등록</h3>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <form id="writeupForm">
                <input type="hidden" id="editIndex" value="-1">
                <div class="form-row">
                    <div class="form-group">
                        <label for="inputTitle">문제 제목</label>
                        <input type="text" id="inputTitle" placeholder="예: [Dreamhack] XSS Basic" required>
                    </div>
                    <div class="form-group">
                        <label for="inputPassword">관리자 비밀번호 (작성/수정용)</label>
                        <input type="password" id="inputPassword" placeholder="비밀번호 입력" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="inputTags">태그 (쉼표로 구분)</label>
                        <input type="text" id="inputTags" placeholder="Web Hacking, Dreamhack" required>
                    </div>
                    <div class="form-group">
                        <label for="inputDate">날짜 (YYYY-MM)</label>
                        <input type="text" id="inputDate" placeholder="2026-04" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group full-width">
                        <label for="inputLink">풀이 링크 (선택사항)</label>
                        <input type="url" id="inputLink" placeholder="https://github.com/...">
                    </div>
                </div>
                <div class="form-group full-width">
                    <label for="inputSummary">한줄 요약</label>
                    <input type="text" id="inputSummary" placeholder="쿠키 탈취를 위한 XSS 페이로드 우회 실습" required>
                </div>
                <div class="form-group full-width">
                    <label for="inputDetail">상세 내용 (풀이 과정 및 분석 메모)</label>
                    <textarea id="inputDetail" placeholder="# Analysis&#10;- 스크립트 필터링 우회 방안 정리..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-submit">등록 / 저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <main class="container content-section">
        <h2 class="section-title">CTF Write-up Archive</h2>
        <p class="section-desc">보안 문제 풀이 및 분석 과정을 기록하는 공간입니다. 항목을 클릭하여 상세 풀이를 확인하세요.</p>

        <div class="terminal-bar">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
            <span>bash - ctf_secure_archive.sh</span>
        </div>

        <div class="writeup-list" id="writeupContainer"></div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2026 박대만. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        // 변경된 관리자 비밀번호 적용 완료
        const ADMIN_PASSWORD = "299729458";

        let writeupData = JSON.parse(localStorage.getItem('ctf_writeups')) || [
            {
                tags: ["OverTheWire", "Bandit"],
                date: "2026-03",
                title: "[Bandit] Level 16 → Level 17 Write-up",
                link: "https://github.com",
                summary: "포트 스캔(nmap) 활용 및 SSH 키 교환 과정 트러블슈팅 정리",
                detail: "# Problem Analysis\n- nmap을 통한 포트 스캔 범위 지정 및 서비스 확인\n- SSL/TLS 연결 시 발생하는 renegotiation 이슈 해결 과정 참조",
                password: "299729458"
            }
        ];

        const container = document.getElementById('writeupContainer');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const writeModal = document.getElementById('writeModal');
        const writeupForm = document.getElementById('writeupForm');
        const modalHeading = document.getElementById('modalHeading');
        const editIndexInput = document.getElementById('editIndex');

        openModalBtn.onclick = (e) => {
            e.preventDefault();
            modalHeading.innerText = "새로운 CTF Write-up 등록";
            editIndexInput.value = -1;
            writeupForm.reset();
            document.getElementById('inputPassword').value = ADMIN_PASSWORD; // 기본값 세팅
            writeModal.style.display = 'flex';
        };

        closeModalBtn.onclick = () => {
            writeModal.style.display = 'none';
        };

        window.onclick = (e) => {
            if (e.target == writeModal) {
                writeModal.style.display = 'none';
            }
        };

        function renderWriteups() {
            container.innerHTML = '';
            
            writeupData.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'writeup-item';
                
                itemDiv.onclick = function(e) {
                    if (e.target.tagName === 'A' || e.target.tagName === 'BUTTON' || e.target.closest('a') || e.target.closest('button')) return;
                    this.classList.toggle('active');
                };

                let tagsHtml = '';
                item.tags.forEach(tag => {
                    tagsHtml += `<span class="tag">${tag.trim()}</span>`;
                });

                let linkHtml = '';
                if (item.link && item.link.trim() !== '') {
                    linkHtml = `<a href="${item.link}" target="_blank" class="action-btn link-btn">풀이 링크 &rarr;</a>`;
                }

                itemDiv.innerHTML = `
                    <div class="meta-info">
                        <div class="meta-left">${tagsHtml}</div>
                        <span class="date">${item.date}</span>
                    </div>
                    <div class="writeup-title-area">
                        <div class="writeup-title">${item.title}</div>
                        <div class="btn-group">
                            ${linkHtml}
                            <button class="action-btn" onclick="openEditModal(${index})">수정</button>
                            <button class="action-btn del" onclick="deleteWriteup(${index})">삭제</button>
                        </div>
                    </div>
                    <div class="writeup-summary">${item.summary}</div>
                    <div class="writeup-detail">${item.detail}</div>
                `;

                container.appendChild(itemDiv);
            });
        }

        window.openEditModal = function(index) {
            const pwd = prompt("해당 글을 수정하려면 비밀번호를 입력하세요:");
            if (pwd === null) return;
            
            const target = writeupData[index];
            const checkPwd = target.password || ADMIN_PASSWORD;

            if (pwd !== checkPwd && pwd !== ADMIN_PASSWORD) {
                alert("비밀번호가 일치하지 않습니다!");
                return;
            }

            modalHeading.innerText = "CTF Write-up 수정";
            editIndexInput.value = index;
            
            document.getElementById('inputTitle').value = target.title;
            document.getElementById('inputPassword').value = target.password || ADMIN_PASSWORD;
            document.getElementById('inputTags').value = target.tags.join(', ');
            document.getElementById('inputDate').value = target.date;
            document.getElementById('inputLink').value = target.link || '';
            document.getElementById('inputSummary').value = target.summary;
            document.getElementById('inputDetail').value = target.detail;

            writeModal.style.display = 'flex';
        };

        window.deleteWriteup = function(index) {
            const pwd = prompt("해당 글을 삭제하려면 비밀번호를 입력하세요:");
            if (pwd === null) return;

            const target = writeupData[index];
            const checkPwd = target.password || ADMIN_PASSWORD;

            if (pwd !== checkPwd && pwd !== ADMIN_PASSWORD) {
                alert("비밀번호가 일치하지 않습니다!");
                return;
            }

            if (confirm("정말 이 라이트업을 삭제하시겠습니까?")) {
                writeupData.splice(index, 1);
                localStorage.setItem('ctf_writeups', JSON.stringify(writeupData));
                renderWriteups();
            }
        };

        writeupForm.onsubmit = function(e) {
            e.preventDefault();

            const editIdx = parseInt(editIndexInput.value);
            const title = document.getElementById('inputTitle').value;
            const password = document.getElementById('inputPassword').value;
            const tagsInput = document.getElementById('inputTags').value;
            const date = document.getElementById('inputDate').value;
            const link = document.getElementById('inputLink').value;
            const summary = document.getElementById('inputSummary').value;
            const detail = document.getElementById('inputDetail').value;

            const tags = tagsInput.split(',');

            const entryData = {
                tags: tags,
                date: date,
                title: title,
                link: link,
                summary: summary,
                detail: detail,
                password: password
            };

            if (editIdx === -1) {
                writeupData.unshift(entryData);
            } else {
                writeupData[editIdx] = entryData;
            }

            localStorage.setItem('ctf_writeups', JSON.stringify(writeupData));
            renderWriteups();

            writeupForm.reset();
            writeModal.style.display = 'none';
            editIndexInput.value = -1;
        };

        renderWriteups();
    </script>
</body>
</html>
